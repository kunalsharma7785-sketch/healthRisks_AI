services:
  postgres:
    image: postgres:15-alpine
    container_name: healthrisk_postgres
    environment:
      POSTGRES_USER: healthrisk_user
      POSTGRES_PASSWORD: healthrisk_secure_password_123
      POSTGRES_DB: healthrisk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthrisk_user -d healthrisk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthrisk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthrisk_backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://healthrisk_user:healthrisk_secure_password_123@postgres:5432/healthrisk_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: healthrisk-ai-secure-docker-secret-key-32-chars-minimum
      MODEL_DIR: /app/ml_models
      FRONTEND_DIR: /frontend
    volumes:
      - ./frontend:/frontend:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
